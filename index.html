<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ДПО-1 · Практикумы 5–6</title><style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;
  --card:#ffffff;
  --border:#e2e8f0;
  --indigo:#0047ff;
  --indigo-dk:#002060;
  --indigo-lt:#e5efff;
  --cyan:#0ea5e9;
  --cyan-lt:#e0f2fe;
  --amber:#f59e0b;
  --amber-lt:#fffbeb;
  --green:#16a34a;
  --green-lt:#f0fdf4;
  --red:#dc2626;
  --red-lt:#fef2f2;
  --text:#0f172a;
  --muted:#64748b;
  --nav-h:56px;
}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(circle at 12% 0%,rgba(0,71,255,.14),transparent 32%),
    radial-gradient(circle at 85% 6%,rgba(14,165,233,.13),transparent 34%),
    linear-gradient(180deg,#f8fafc 0%,#e5efff 30%,#f8fafc 100%);
  color:var(--text);
  line-height:1.65;
  overflow-x:hidden;
}

/* NAV */
nav.top{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);
  background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);box-shadow:0 1px 10px rgba(0,0,0,.06);
  display:flex;align-items:center;padding:0 20px;z-index:900;
  gap:2px;overflow-x:auto;scrollbar-width:none;
}
nav.top::-webkit-scrollbar{display:none}
.nav-logo{font-weight:900;font-size:.93rem;color:var(--indigo-dk);white-space:nowrap;margin:0 10px 0 4px;flex-shrink:0}
.nav-sep{width:1px;height:18px;background:var(--border);margin:0 6px;flex-shrink:0}
.nav-link{padding:5px 10px;border-radius:6px;font-size:.75rem;font-weight:700;color:var(--muted);text-decoration:none;white-space:nowrap;transition:color .2s,background .2s;flex-shrink:0}
.nav-link:hover,.nav-link.active{color:var(--indigo);background:var(--indigo-lt)}
.nav-link:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

/* HERO */
#hero{
  min-height:100vh;padding:calc(var(--nav-h) + 56px) 24px 64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.hero-badge{padding:5px 14px;background:var(--indigo-lt);border:1px solid #c7d2fe;border-radius:100px;font-size:.78rem;font-weight:700;color:var(--indigo-dk)}
.hero-title{font-size:clamp(2rem,5.5vw,3.6rem);font-weight:900;line-height:1.12;letter-spacing:-1.5px;margin-bottom:16px;max-width:900px}
.hero-title em{color:var(--indigo);font-style:normal}
.hero-sub{font-size:1.05rem;color:var(--muted);max-width:660px;margin-bottom:36px}
.hero-img{max-width:900px;width:100%;margin-bottom:40px}
.hero-nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:820px}
.hero-nav a{padding:8px 16px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-size:.82rem;font-weight:600;color:var(--text);text-decoration:none;box-shadow:0 2px 8px rgba(15,23,42,.05);transition:transform .15s,box-shadow .15s}
.hero-nav a:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,71,255,.15)}

/* SECTIONS */
.sec{max-width:1180px;margin:0 auto;padding:72px 24px}
.sec-head{margin-bottom:36px}
.num-badge{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:13px;font-size:1.1rem;font-weight:900;color:#fff;margin-bottom:14px}
.n1{background:linear-gradient(135deg,#0047ff,#818cf8)}
.n2{background:linear-gradient(135deg,#0ea5e9,#38bdf8)}
.n3{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
.n4{background:linear-gradient(135deg,#16a34a,#4ade80)}
.n5{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.n6{background:linear-gradient(135deg,#ec4899,#f472b6)}
.n7{background:linear-gradient(135deg,#dc2626,#f87171)}
.n8{background:linear-gradient(135deg,#0891b2,#22d3ee)}
.n9{background:linear-gradient(135deg,#002060,#0047ff)}
.sec-title{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:800;letter-spacing:-.5px;margin-bottom:10px}
.sec-desc{font-size:1rem;color:var(--muted);max-width:760px;line-height:1.75}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(15,23,42,.04)}

/* CARD GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.grid .c-name{font-weight:800;margin-bottom:8px;font-size:.96rem}
.grid p:not(.c-name){color:var(--muted);font-size:.88rem;line-height:1.6}

/* CALLOUTS */
.note-callout{background:var(--indigo-lt);border:1px solid #c7d2fe;border-radius:14px;padding:16px 20px;margin-bottom:24px}
.note-callout p{color:var(--indigo-dk);font-size:.92rem;line-height:1.7}
.warn-callout{background:var(--amber-lt);border:1px solid #fcd34d;border-radius:16px;padding:20px 24px;margin-top:20px}
.warn-callout p{color:#78350f;line-height:1.7;font-size:.93rem}

/* IMAGE CARD + PLACEHOLDER */
.img-card{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(15,23,42,.12);cursor:zoom-in}
.img-card img{display:block;width:100%;height:auto}
.img-card .img-missing-caption{display:none}
.img-card.img-missing{border:2px dashed var(--border);background:var(--indigo-lt);min-height:220px;display:flex;align-items:center;justify-content:center;box-shadow:none;cursor:default}
.img-card.img-missing img{display:none}
.img-card.img-missing .img-missing-caption{display:block;color:var(--muted);font-size:.85rem;text-align:center;padding:24px;max-width:340px}

/* VIZ CARD (iframe) */
.viz{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.07)}
.viz-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#f8fafc;border-bottom:1px solid var(--border)}
.dots{display:flex;gap:5px}
.dot{width:10px;height:10px;border-radius:50%}
.dr{background:#ff5f57}.dy{background:#febb2c}.dg{background:#27c840}
.viz-lbl{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);flex:1}
.viz-fs{display:flex;align-items:center;gap:5px;padding:4px 10px;background:transparent;border:1px solid var(--border);border-radius:6px;font-size:.71rem;font-weight:600;color:var(--muted);cursor:pointer;transition:background .2s,color .2s,border-color .2s;white-space:nowrap}
.viz-fs:hover{background:var(--indigo-lt);color:var(--indigo);border-color:#c7d2fe}
.viz iframe{width:100%;border:none;display:block}

/* PROMPT BOX */
.prompt-box{background:#0f172a;border-radius:14px;overflow:hidden;margin-bottom:18px}
.prompt-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#1e293b;color:#e2e8f0;font-size:.82rem;font-weight:700}
.copy-btn{padding:5px 12px;border-radius:8px;border:1px solid #475569;background:transparent;color:#e2e8f0;font-size:.76rem;font-weight:700;cursor:pointer;transition:background .2s}
.copy-btn:hover{background:#334155}
.prompt-box pre{margin:0;padding:18px 16px;color:#e2e8f0;font-size:.82rem;line-height:1.6;overflow-x:auto;white-space:pre-wrap;word-break:break-word}

/* LIGHTBOX */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:2000;display:flex;align-items:center;justify-content:center;padding:32px;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.overlay img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.overlay-close{position:absolute;top:18px;right:22px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.overlay-close:hover{background:rgba(255,255,255,.22)}
.overlay-download{position:absolute;top:18px;right:72px;height:40px;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none;z-index:2}
.overlay-download:hover{background:rgba(255,255,255,.22)}

/* FULLSCREEN IFRAME OVERLAY */
#fs-overlay{position:fixed;inset:0;background:rgba(2,6,23,.94);z-index:2100;display:none;flex-direction:column}
#fs-overlay.open{display:flex}
#fs-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(0,0,0,.4);border-bottom:1px solid rgba(255,255,255,.08)}
#fs-title{font-size:.8rem;font-weight:700;color:rgba(255,255,255,.65);flex:1}
#fs-close{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.8);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
#fs-close:hover{background:rgba(255,255,255,.2)}
#fs-frame{flex:1;border:none;background:#fff}

/* CHECKLIST */
.checklist-progress-bar{height:10px;border-radius:100px;background:var(--indigo-lt);overflow:hidden;margin-bottom:20px}
.checklist-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--indigo),var(--cyan));border-radius:100px;transition:width .3s ease}
.checklist-items{list-style:none;display:flex;flex-direction:column;gap:12px}
.checklist-items label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.95rem}
.checklist-items input{width:18px;height:18px;accent-color:var(--indigo);cursor:pointer;flex-shrink:0}
.checklist-done{margin-top:18px;padding:12px 16px;background:var(--green-lt);color:var(--green);border-radius:10px;font-weight:700}

/* QUIZ */
.quiz{display:flex;flex-direction:column;gap:18px}
.quiz-question{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 22px}
.quiz-text{font-weight:700;margin-bottom:12px}
.quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.quiz-options label{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.quiz-options label.quiz-correct-answer{color:var(--green);font-weight:700}
.quiz-options input{accent-color:var(--indigo)}
.quiz-check{padding:8px 16px;border-radius:9px;border:none;background:var(--indigo);color:#fff;font-weight:700;font-size:.82rem;cursor:pointer}
.quiz-check:hover{background:var(--indigo-dk)}
.quiz-feedback{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:.9rem}
.quiz-feedback.correct{background:var(--green-lt);color:var(--green)}
.quiz-feedback.incorrect{background:var(--red-lt);color:var(--red)}
.quiz-score-box{text-align:center;font-weight:800;color:var(--indigo-dk)}

/* CONCLUSION */
.conclusion-list{list-style:none;counter-reset:concl;display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
.conclusion-list li{counter-increment:concl;padding-left:38px;position:relative;font-size:1rem}
.conclusion-list li::before{content:counter(concl);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--indigo);color:#fff;font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center}

.svc-link{color:var(--indigo);font-weight:700;text-decoration:underline;text-underline-offset:2px}

/* SCROLL REVEAL */
.fade{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}
.fade.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;transition:none}}
@media (max-width:900px){.sec{padding:56px 18px}}

footer{text-align:center;padding:32px 20px 48px;color:var(--muted);font-size:.85rem}
